<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema criptográfico RSA — Parcial 3</title>
  <style>
    :root { --barra: #dcdad5; --borde: #9a9a9a; --sombra: #b3b1ac; --azul: #1f4e79; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #222; font: 16px/1.6 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
    #cabecera { position: sticky; top: 0; z-index: 5; background: var(--barra); display: flex; align-items: center;
      justify-content: space-between; gap: 12px; padding: 10px 20px; flex-wrap: wrap; border-bottom: 1px solid var(--borde); }
    #cabecera strong { font-size: 17px; }
    .abrir { display: inline-block; background: #fff; color: #111; text-decoration: none; font-weight: 600;
      border: 1px solid var(--borde); border-radius: 8px; padding: 8px 24px; box-shadow: 2px 3px 3px var(--sombra); }
    .abrir:hover { background: #cfe2f3; }
    main { max-width: 900px; margin: 0 auto; padding: 8px 20px 60px; }
    .destacado { text-align: center; margin: 22px 0 6px; }
    .destacado .abrir { font-size: 18px; padding: 12px 40px; }
    .destacado p { color: #555; margin: 8px 0 0; font-size: 14px; }
    #readme table { border-collapse: collapse; margin: 12px 0; display: block; overflow-x: auto; }
    #readme th, #readme td { border: 1px solid #ccc; padding: 4px 10px; }
    #readme th { background: #f0f0f0; }
    #readme pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13.5px; }
    #readme code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; font-size: .92em; }
    #readme pre code { background: none; padding: 0; }
    #readme h1 { border-bottom: 1px solid #ddd; padding-bottom: 6px; }
    #readme h2 { border-bottom: 1px solid #eee; padding-bottom: 4px; margin-top: 32px; }
    #readme img { max-width: 100%; }
  </style>
</head>
<body>
  <header id="cabecera">
    <strong>Sistema criptográfico RSA — Parcial 3</strong>
    <a class="abrir" href="app/">Abrir el programa ▶</a>
  </header>
  <main>
    <div class="destacado">
      <a class="abrir" href="app/">Abrir el programa ▶</a>
      <p>Funciona directamente en el navegador, sin instalar nada ni iniciar sesión.</p>
    </div>
    <article id="readme">Cargando documentación…</article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    fetch("README.md").then(r => r.text()).then(t => {
      document.getElementById("readme").innerHTML = marked.parse(t);
    }).catch(() => {
      document.getElementById("readme").innerHTML =
        '<p>No se pudo mostrar la documentación aquí. Puede verla en el <a href="https://github.com/turis0077/RSA-Cryptographic-System#readme">repositorio</a>.</p>';
    });
  </script>
</body>
</html>
